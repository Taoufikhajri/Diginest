class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = {hasError: false, error: null};
  }
  static getDerivedStateFromError(error) {
    return {hasError: true, error};
  }
  componentDidCatch(error, info) {
    console.error('React Error:', error, info);
  }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', {
        style:{padding:'20px', background:'#fef2f2', borderRadius:'12px', margin:'10px', direction:'ltr', fontFamily:'Plus Jakarta Sans,sans-serif'}
      },
        React.createElement('p', {style:{color:'#dc2626', fontWeight:'bold'}}, '⚠️ Erreur : ' + (this.state.error?.message || 'Erreur inconnue')),
        React.createElement('button', {
          onClick: () => this.setState({hasError:false, error:null}),
          style:{marginTop:'8px', padding:'6px 14px', background:'#1A5FD4', color:'#fff', border:'none', borderRadius:'8px', cursor:'pointer'}
        }, 'Réessayer')
      );
    }
    return this.props.children;
  }
}

function AdmArticleWriter() {
  const {settings, showToast, refreshSettings} = useApp();
  const [form, setForm] = React.useState({
    topic: '',
    lang: 'fr',
    tone: 'friendly',
    length: 'medium',
    tag: 'Astuces',
    icon: '💡'
  });
  const [generating, setGenerating] = React.useState(false);
  const [result, setResult] = React.useState(null);
  const [apiKey, setApiKey] = React.useState(settings.openaiKey || '');
  const [savingKey, setSavingKey] = React.useState(false);
  const [publishing, setPublishing] = React.useState(false);

  const tones = [
    {v:'friendly', l:'Amical et simple'},
    {v:'professional', l:'Formel et professionnel'},
    {v:'tunisian', l:'Décontracté (style tunisien)'},
  ];
  const lengths = [
    {v:'short', l:'Court (200 mots)', words: 200},
    {v:'medium', l:'Moyen (400 mots)', words: 400},
    {v:'long', l:'Détaillé (700 mots)', words: 700},
  ];
  const tags = ['Astuces','Guide','Avis','Offre','Nouveautés','Tech'];
  const icons = ['💡','🤖','🎨','📱','💼','🔒','⚡','🌟','📊','🎯'];

  const saveApiKey = async () => {
    setSavingKey(true);
    try {
      await api('settings-save', {openaiKey: apiKey});
      await refreshSettings();
      showToast('✅ Clé API enregistrée');
    } catch(e) { showToast('Erreur d’enregistrement','error'); }
    setSavingKey(false);
  };

  const generate = async () => {
    const key = settings.openaiKey || apiKey;
    if (!key) return showToast('Ajoutez d’abord une clé API OpenAI','error');
    if (!form.topic.trim()) return showToast('Écrivez le sujet de l’article','error');
    setGenerating(true);
    setResult(null);
    try {
      const wordCount = lengths.find(l=>l.v===form.length)?.words || 400;
      const langInstr = form.lang === 'ar-TN'
        ? 'Écris en arabe standard simple avec quelques touches tunisiennes naturelles'
        : form.lang === 'tn' ? 'Écris entièrement en derja tunisienne'
        : form.lang === 'fr' ? 'Écris en français naturel et professionnel'
        : 'Write in clear, professional English';
      const toneInstr = form.tone === 'friendly' ? 'Ton amical et proche du lecteur'
        : form.tone === 'professional' ? 'Ton formel et professionnel'
        : 'Ton décontracté, proche du parler tunisien, mais en français';

      const siteInfo = `Site : ${settings.brand||'DigiNest'} — plateforme tunisienne de vente d’abonnements : ChatGPT, Canva, Adobe, Gemini et autres.`;

      const kwPart = form.keywords ? '\nMots-clés SEO — intègre-les naturellement : ' + form.keywords : '';
      const prompt = `Tu es un rédacteur web expert pour une plateforme tunisienne d’abonnements numériques.
${siteInfo}
${langInstr}. ${toneInstr}.
Rédige un article intitulé : « ${form.topic} »
Longueur souhaitée : environ ${wordCount} mots.
Structure : commence par un titre principal, puis une introduction, des sections avec sous-titres, et une conclusion.${kwPart}
Le contenu doit être utile et lié aux abonnements numériques.
N’ajoute aucun commentaire en dehors de l’article.`;

      // Route through backend to avoid CORS
      const _tok = localStorage.getItem(TOKEN_KEY);
      const response = await fetch('./api.php?action=ai-article', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', ...(_tok ? {'Authorization': 'Bearer ' + _tok, 'X-Auth-Token': _tok} : {})},
        body: JSON.stringify({prompt, maxTokens: 1500})
      });
      if (!response.ok) {
        const errData = await response.json().catch(()=>({}));
        throw new Error(errData.error || 'Erreur lors de la génération de l’article');
      }
      const data = await response.json();
      if (data.error) throw new Error(data.error);
      const text = data.text || '';

      // Extract title from first line
      const lines = text.trim().split('\n');
      const title = lines[0].replace(/^#+\s*/, '').replace(/\*\*/g,'').trim();
      const body = lines.slice(1).join('\n').trim();

      setResult({ title, body, fullText: text, tag: form.tag, icon: form.icon });

function AnnouncementBar() {
  const { settings } = useApp();
  let items = settings.announcements;
  if (typeof items === 'string') { try { items = JSON.parse(items); } catch(_) { items = []; } }
  if (!Array.isArray(items)) items = [];
  items = items.map(x => typeof x === 'string' ? x : (x && x.text) || '').filter(Boolean);
  if (items.length === 0) return null;
  const loop = items.concat(items);
  return React.createElement("div", {className: "announce-bar"},
    React.createElement("div", {className: "announce-track"},
      loop.map((t, i) => React.createElement("span", {key: i}, "📢 ", t))
    )
  );
}

}
function AppRoutes({user, view}) {
  if (view === 'landing') return React.createElement(ErrorBoundary, null, React.createElement(Landing, null));
  if (view === 'login') return React.createElement(AuthScreen, {
    mode: "login"
  });
  if (view === 'register') return React.createElement(AuthScreen, {
    mode: "register"
  });
  if (view === 'checkout') return React.createElement(Checkout, null);
  if (view === 'chatgpt-calc') return React.createElement(ChatGPTCalc, null);
  if (view === 'dashboard') {
    if (!user) return React.createElement(AuthScreen, {
      mode: "login"
    });
    if (user.role === 'admin') return React.createElement(AdminDashboard, null);
    return React.createElement(ErrorBoundary, null, React.createElement(CustomerDashboard, null));
  }
  if (view === 'admin') {
    if (!user || user.role !== 'admin') return React.createElement(AuthScreen, {
      mode: "login"
    });
    return React.createElement(ErrorBoundary, null, React.createElement(AdminDashboard, null));
  }
  return React.createElement(Landing, null);
}

  )
);
  // Hide the splash screen once the app has booted
  (function hideSplash(){
    var splash = document.getElementById('app-splash');
    if (!splash) return;
    var done = false;
    var go = function(){ if (done) return; done = true; splash.classList.add('hide'); setTimeout(function(){ if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 600); };
    // Short minimum display time + after paint
    requestAnimationFrame(function(){ setTimeout(go, 350); });

    setTimeout(go, 4000); // safety
  })();
  } catch (err) {
    document.getElementById('error-display').style.display = 'block';

<script>
// PWA Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js?v=1', { scope: './' }).catch(() => {});
  });
}
// Ripple effect on all buttons
document.addEventListener('pointerdown', function(e){
  var btn = e.target && e.target.closest ? e.target.closest('button') : null;
  if (!btn) return;
  if (btn.disabled) return;
  try {
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var span = document.createElement('span');
    span.className = 'rpl';
    span.style.width = span.style.height = size + 'px';
    span.style.left = (e.clientX - rect.left - size/2) + 'px';
    span.style.top  = (e.clientY - rect.top  - size/2) + 'px';
    btn.appendChild(span);
    setTimeout(function(){ if (span && span.parentNode) span.parentNode.removeChild(span); }, 560);
  } catch(_) {}
}, {passive:true});
</script>
